<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turnstile test</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>body{font:16px system-ui;padding:40px;max-width:520px;margin:auto}#log{white-space:pre-wrap;color:#555}</style>
</head>
<body>
<h1>Turnstile test page</h1>
<p>A Cloudflare box should appear below and turn into "Success".</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAEpWcORDrCo161UR" data-callback="onOk" data-error-callback="onErr"></div>
<p id="log">Waiting for the script…</p>
<script>
  var log = document.getElementById('log');
  function onOk(t) { log.textContent = 'SUCCESS: token received (' + t.length + ' chars)'; }
  function onErr(c) { log.textContent = 'WIDGET ERROR: ' + c; }
  setTimeout(function () { if (!window.turnstile) log.textContent = 'SCRIPT NOT LOADED after 5 s: the browser or an extension blocked challenges.cloudflare.com'; else if (log.textContent.startsWith('Waiting')) log.textContent = 'Script loaded, widget rendering…'; }, 5000);
</script>
</body>
</html>
